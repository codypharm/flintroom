[project]
name = "flintroom-backend"
version = "0.1.0"
description = "Flintroom API — panel interrogation, minutes ledger, debrief"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    # A WebSocket *client*. FastAPI and Starlette provide only the server half,
    # and httpx does not implement the protocol at all — so nothing already
    # here can dial the voice provider, which is the one integration this
    # product cannot work without.
    #
    # `websockets` is the reference implementation, pure Python with no C
    # extension to build. It is confined to the ElevenLabs adapter: the relay
    # depends on our own Protocol, so replacing the library, or the provider,
    # touches one module.
    "websockets>=13.0",
    # The S3 API, for material storage. CLAUDE.md requires uploaded material to
    # be delivered by presigned URL and never proxied, and nothing already here
    # can sign one: a presigned URL is an HMAC-SHA256 chain over a canonical
    # request, not an HTTP call httpx could make.
    #
    # Hand-writing SigV4 was the alternative and is roughly seventy lines. boto3
    # won on two counts: it is the reference implementation of the one protocol
    # our storage contract depends on, and it already knows multipart presigning
    # if a 100 MB deck over a phone connection ever needs resumable upload.
    #
    # 27 MB installed, against an image that will also carry LibreOffice for
    # PPTX rendering. Confined to `core/storage_s3.py`, so replacing it — or the
    # storage vendor — touches one module.
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    # Tooling only — the application never parses YAML at runtime. It is here
    # because `contracts/openapi.yaml` is the published API contract
    # (CLAUDE.md), and both writing that file and checking it has not drifted
    # need a YAML parser. The alternative was publishing JSON instead, which
    # would leave the contract unreadable in a diff — and reading it in a diff
    # is the entire reason it is committed rather than served.
    "pyyaml>=6.0",
    # A server to run the API with. Absent until now because every test drives
    # the app through `httpx.AsyncClient` in-process, so nothing had ever
    # actually served it — which meant `uv run uvicorn` failed with "no such
    # file" rather than with anything about configuration.
    #
    # A dev dependency, not a runtime one: what serves the app in production is
    # a deployment decision (see `docs/deployment.md`), and pinning a server
    # into the application's own dependencies pre-empts it.
    "uvicorn[standard]>=0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
