[project]
name = "flintroom-backend"
version = "0.1.0"
description = "Flintroom API — panel interrogation, minutes ledger, debrief"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    # A WebSocket *client*. FastAPI and Starlette provide only the server half,
    # and httpx does not implement the protocol at all — so nothing already
    # here can dial the voice provider, which is the one integration this
    # product cannot work without.
    #
    # `websockets` is the reference implementation, pure Python with no C
    # extension to build. It is confined to the ElevenLabs adapter: the relay
    # depends on our own Protocol, so replacing the library, or the provider,
    # touches one module.
    "websockets>=13.0",
    # The S3 API, for material storage. CLAUDE.md requires uploaded material to
    # be delivered by presigned URL and never proxied, and nothing already here
    # can sign one: a presigned URL is an HMAC-SHA256 chain over a canonical
    # request, not an HTTP call httpx could make.
    #
    # Hand-writing SigV4 was the alternative and is roughly seventy lines. boto3
    # won on two counts: it is the reference implementation of the one protocol
    # our storage contract depends on, and it already knows multipart presigning
    # if a 100 MB deck over a phone connection ever needs resumable upload.
    #
    # 27 MB installed, against an image that will also carry LibreOffice for
    # PPTX rendering. Confined to `core/storage_s3.py`, so replacing it — or the
    # storage vendor — touches one module.
    "boto3>=1.35",
    # Reading a deck. `docs/ingestion.md` §3.2 wants claims, figures and chart
    # data per slide, and chart values are not in a PDF's text layer — a text-only
    # parser returns a chart's axis labels and none of its numbers. So every page
    # is needed twice: as text, and as an image a vision model can look at.
    #
    # pypdfium2 does both, so this is one dependency rather than two, and PDFium
    # is the engine in Chrome — it renders what the author saw. 7.3 MB, wheels
    # only, no system binary to install or version.
    #
    # PyMuPDF is the better extractor and was rejected on its licence: AGPL-3.0
    # or an Artifex commercial licence, and AGPL §13 obliges a *network service*
    # to offer source to its users. That is this backend exactly. pypdf plus a
    # poppler subprocess was the other alternative — two dependencies for one
    # job, one of them a second external binary to install and debug.
    "pypdfium2>=5.0",
    # Downscaling and encoding. A page renders at ~1568px because that is where
    # vision models stop gaining detail, and the thumbnail that outlives the
    # deleted source document is a downscale of page one — neither is something
    # pypdfium2 does. It also normalises uploaded photos, which arrive at
    # whatever resolution a phone camera produces.
    "pillow>=11.0",
    # HEIC, which is what an iPhone camera produces by default. Pillow cannot
    # read it, and photographing a whiteboard is the mobile-native input in §3.2
    # — so without this the most likely photo from the most likely device is the
    # one format we accept and then fail to open. Registers a Pillow plugin and
    # is otherwise never imported.
    "pillow-heif>=0.21",
    # Talking to the extraction model. The vendor decision is already made —
    # `docs/ingestion.md` names Claude as the first adapter, chosen because it
    # takes each page as text and image together, and chart values are not in a
    # text layer.
    #
    # The SDK rather than raw httpx, which would work and is roughly fifty
    # lines. It wins on the two things those fifty lines would not include:
    # retry-with-backoff against a provider that returns 429s under load, and
    # the Batch API — `docs/ingestion.md` notes batch pricing roughly halves
    # cost, and extraction is latency-insensitive, so that discount is free
    # here and worth not having to hand-roll.
    #
    # MIT, 6.4 MB, and it brings almost nothing new: httpx, pydantic, anyio,
    # sniffio and typing-extensions are already installed. Confined to
    # `extraction_models/claude.py`, so a second vendor is a sibling module.
    "anthropic>=0.69",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    # Tooling only — the application never parses YAML at runtime. It is here
    # because `contracts/openapi.yaml` is the published API contract
    # (CLAUDE.md), and both writing that file and checking it has not drifted
    # need a YAML parser. The alternative was publishing JSON instead, which
    # would leave the contract unreadable in a diff — and reading it in a diff
    # is the entire reason it is committed rather than served.
    "pyyaml>=6.0",
    # A server to run the API with. Absent until now because every test drives
    # the app through `httpx.AsyncClient` in-process, so nothing had ever
    # actually served it — which meant `uv run uvicorn` failed with "no such
    # file" rather than with anything about configuration.
    #
    # A dev dependency, not a runtime one: what serves the app in production is
    # a deployment decision (see `docs/deployment.md`), and pinning a server
    # into the application's own dependencies pre-empts it.
    "uvicorn[standard]>=0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
