[project]
name = "flintroom-backend"
version = "0.1.0"
description = "Flintroom API — panel interrogation, minutes ledger, debrief"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    # A WebSocket *client*. FastAPI and Starlette provide only the server half,
    # and httpx does not implement the protocol at all — so nothing already
    # here can dial the voice provider, which is the one integration this
    # product cannot work without.
    #
    # `websockets` is the reference implementation, pure Python with no C
    # extension to build. It is confined to the ElevenLabs adapter: the relay
    # depends on our own Protocol, so replacing the library, or the provider,
    # touches one module.
    "websockets>=13.0",
    # The S3 API, for material storage. CLAUDE.md requires uploaded material to
    # be delivered by presigned URL and never proxied, and nothing already here
    # can sign one: a presigned URL is an HMAC-SHA256 chain over a canonical
    # request, not an HTTP call httpx could make.
    #
    # Hand-writing SigV4 was the alternative and is roughly seventy lines. boto3
    # won on two counts: it is the reference implementation of the one protocol
    # our storage contract depends on, and it already knows multipart presigning
    # if a 100 MB deck over a phone connection ever needs resumable upload.
    #
    # 27 MB installed, against an image that will also carry LibreOffice for
    # PPTX rendering. Confined to `core/storage_s3.py`, so replacing it — or the
    # storage vendor — touches one module.
    "boto3>=1.35",
    # Parses one multipart body: the coaching clip. FastAPI's `UploadFile`
    # refuses to start without it, and there is no smaller way to accept a file
    # over HTTP.
    #
    # Worth justifying against CLAUDE.md, which says uploaded material is
    # "delivered via presigned URL only, never proxied". That rule is about
    # decks — tens of megabytes, stored, extracted later — and it keeps them off
    # the API process entirely. A coaching turn is a few seconds of speech that
    # is heard, answered and dropped; presigning it would put the user's voice
    # in object storage and leave us owing a deletion for every sentence they
    # say, which is worse on privacy and slower on a phone.
    #
    # Bounded in the route by MAX_CLIP_BYTES, because "proxied" without a
    # ceiling is a memory exhaustion endpoint.
    "python-multipart>=0.0.9",
    # Reading a deck. `docs/ingestion.md` §3.2 wants claims, figures and chart
    # data per slide, and chart values are not in a PDF's text layer — a text-only
    # parser returns a chart's axis labels and none of its numbers. So every page
    # is needed twice: as text, and as an image a vision model can look at.
    #
    # pypdfium2 does both, so this is one dependency rather than two, and PDFium
    # is the engine in Chrome — it renders what the author saw. 7.3 MB, wheels
    # only, no system binary to install or version.
    #
    # PyMuPDF is the better extractor and was rejected on its licence: AGPL-3.0
    # or an Artifex commercial licence, and AGPL §13 obliges a *network service*
    # to offer source to its users. That is this backend exactly. pypdf plus a
    # poppler subprocess was the other alternative — two dependencies for one
    # job, one of them a second external binary to install and debug.
    "pypdfium2>=5.0",
    # Downscaling and encoding. A page renders at ~1568px because that is where
    # vision models stop gaining detail, and the thumbnail that outlives the
    # deleted source document is a downscale of page one — neither is something
    # pypdfium2 does. It also normalises uploaded photos, which arrive at
    # whatever resolution a phone camera produces.
    "pillow>=11.0",
    # HEIC, which is what an iPhone camera produces by default. Pillow cannot
    # read it, and photographing a whiteboard is the mobile-native input in §3.2
    # — so without this the most likely photo from the most likely device is the
    # one format we accept and then fail to open. Registers a Pillow plugin and
    # is otherwise never imported.
    "pillow-heif>=0.21",
    # Talking to the extraction model. The vendor decision is already made —
    # `docs/ingestion.md` names Claude as the first adapter, chosen because it
    # takes each page as text and image together, and chart values are not in a
    # text layer.
    #
    # The SDK rather than raw httpx, which would work and is roughly fifty
    # lines. It wins on the two things those fifty lines would not include:
    # retry-with-backoff against a provider that returns 429s under load, and
    # the Batch API — `docs/ingestion.md` notes batch pricing roughly halves
    # cost, and extraction is latency-insensitive, so that discount is free
    # here and worth not having to hand-roll.
    #
    # MIT, 6.4 MB, and it brings almost nothing new: httpx, pydantic, anyio,
    # sniffio and typing-extensions are already installed. Confined to
    # `extraction_models/claude.py`, so a second vendor is a sibling module.
    "anthropic>=0.69",
    # Reading a PPTX structurally — the half of PPTX support that is not a
    # render. `docs/ingestion.md`: a chart authored in PowerPoint stores its
    # numbers, and `Series.values` is documented as *"a sequence containing the
    # float values for this series, in the order they appear on the chart"*.
    #
    # Nothing it replaces, because nothing else can do it. The rendered slide
    # goes to a vision model, and a model reading a bar chart off pixels is
    # inferring magnitudes from bar heights — which is exactly the misread figure
    # `docs/auditor-grounding.md` says the grounding story cannot survive. Where
    # PowerPoint stored the number, we read the number.
    #
    # A PPTX is a zip of XML, so the alternative is `zipfile` plus ElementTree
    # plus the DrawingML schema by hand. MIT, pure Python, one dependency
    # (`lxml`), no system binary. Confined to `parsing.py`.
    "python-pptx>=1.0",
    # Encoding a saved room. `docs/session-retention.md` retains the full mixed
    # interrogation, and storing it raw would be ten times the bytes *and* ten
    # times the egress — on the one cost in this product that compounds, in the
    # dimension that is charged repeatedly. Measured on a full twelve-minute
    # room: 23.04 MB of PCM16 in, 2.90 MB of Ogg/Opus out, 12.4s to encode.
    #
    # Nothing already here can do it. Mixing needs no library at all — that is
    # `array` and addition, measured at 0.039 ms against a 20 ms frame budget —
    # but `audioop` was removed in Python 3.13 (PEP 594) and nothing in the
    # standard library of 3.14 speaks Opus or writes an Ogg container.
    #
    # PyAV over an ffmpeg subprocess, on the same grounds `pypdfium2` was chosen
    # over `pypdf` plus poppler: the wheels bundle ffmpeg and libopus, so there
    # is no system binary to install, version or debug. Whether libopus is
    # compiled into a distro's ffmpeg varies by base image, and that is a
    # failure discovered in production rather than at install.
    #
    # 17 MB, against an image that already carries LibreOffice for PPTX
    # rendering. Confined to `voice/encoding.py`, so replacing it — or the codec
    # — touches one module, and the mixer that decides what goes *in* a
    # recording never imports it.
    "av>=18.1.0",
    # The server. This was a dev dependency while "what serves the app in
    # production is a deployment decision" was still open; the decision landed
    # on 2026-08-23 — this app, in a container, served by uvicorn behind the
    # platform's proxy (docs/deployment.md → "On Railway"). The Dockerfile
    # installs only the runtime set, so the server must be in it.
    "uvicorn[standard]>=0.32",

]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    # Tooling only — the application never parses YAML at runtime. It is here
    # because `contracts/openapi.yaml` is the published API contract
    # (CLAUDE.md), and both writing that file and checking it has not drifted
    # need a YAML parser. The alternative was publishing JSON instead, which
    # would leave the contract unreadable in a diff — and reading it in a diff
    # is the entire reason it is committed rather than served.
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

# The type checker, pinned. Run it with:
#
#     uvx ty@0.0.73 check app
#
# **The version is pinned deliberately.** `ty` is preview-stage, so an
# unpinned `uvx ty` can change what it reports between two runs on the same
# code — which turns "the checker is clean" into a statement about the day
# rather than about the source. Raising the pin is a deliberate change with a
# diff, like any other dependency bump.
#
# Run through `uvx` rather than as a dev dependency, for the reason the
# frontend's OpenAPI generator is: a build-time tool has no business sharing
# the application's resolved environment.
#
# **It runs clean, and that is the only state worth keeping it in.** Sixty-eight
# known diagnostics meant a sixty-ninth was invisible, which is the same failure
# as the untyped union it replaced. There is no suppression comment anywhere in
# `app/` and none should be added without a reason written beside it.
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["app"]
