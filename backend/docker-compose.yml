services:
  db:
    image: postgres:16
    container_name: flintroom-db
    environment:
      POSTGRES_USER: flintroom
      POSTGRES_PASSWORD: flintroom
      POSTGRES_DB: flintroom_test
    ports:
      - "55432:5432"
    volumes:
      # Adds `flintroom_dev` alongside the test database, so running the suite
      # does not wipe whatever you are developing against. Applied only when the
      # data directory is empty — see the file for the one-line equivalent.
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/10-dev-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flintroom -d flintroom_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # A real S3 server, not a stub. `docs/ingestion.md` decided this: a filesystem
  # shim cannot do direct-to-storage PUT without proxying — which production
  # forbids — so a shim would leave the presigned path untested until deploy.
  # That is exactly the class of failure `DATABASE_URL` produced.
  #
  # It also means moving to AWS S3, Cloudflare R2 or Backblaze B2 is an endpoint
  # and a credential, because the code speaks the same API here as there.
  #
  # RustFS, pinned, since 2026-09-28. It was MinIO until MinIO stopped
  # publishing community images: Docker Hub's `minio/minio` stopped resolving on
  # 2026-09-16, the pinned `quay.io` release that replaced it was refused on
  # 2026-09-28, and each time every CI run failed at the pull and Railway, which
  # waits for CI, deployed nothing. A copy of the last image would have worked
  # and been frozen for good, with no security fixes, so the server moved
  # instead.
  #
  # RustFS is Apache-2.0, 1.0.0 since 2026-09-16, and speaks the same S3 API.
  # The whole suite passed against it with MinIO stopped before this changed.
  # Production is Cloudflare R2 and never ran either; this is the test server.
  # Move the pin deliberately, with the storage tests green.
  storage:
    image: rustfs/rustfs:1.0.0
    container_name: flintroom-storage
    command: /data
    volumes:
      # Named, not left to the image's anonymous volume. `docker compose up`
      # carries an anonymous volume across a recreate, so a checkout that ran
      # MinIO handed RustFS MinIO's root-owned `/data`, and RustFS, which runs
      # as uid 10001, exited on "Permission denied". A new name starts empty
      # and takes its ownership from the image.
      - storage-data:/data
    environment:
      RUSTFS_ACCESS_KEY: flintroom
      RUSTFS_SECRET_KEY: flintroom
    ports:
      # Offset by 50000 like the database, so an S3 server already running for
      # something else does not collide.
      - "59000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The bucket equivalent of `init-dev-db.sql`: runs once, exits, and makes a
  # fresh `docker compose up` sufficient to run the suite. Creating the bucket
  # from application code was refused: a process that can create buckets is a
  # process holding more S3 permission than it needs for the rest of its life.
  #
  # The AWS CLI rather than a vendor's own client, so the next server swap does
  # not take this with it. `head-bucket` first because `mb` has no
  # `--ignore-existing`, and a second `up` must not fail on a bucket that is
  # already there.
  storage-init:
    image: amazon/aws-cli:2.37.4
    container_name: flintroom-storage-init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: flintroom
      AWS_SECRET_ACCESS_KEY: flintroom
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://storage:9000 s3api head-bucket --bucket flintroom-material 2>/dev/null ||
      aws --endpoint-url http://storage:9000 s3 mb s3://flintroom-material
      "

volumes:
  storage-data:
