<body class="bg-background text-on-background font-body-md antialiased pb-xxl relative min-h-screen">
<!-- Top App Bar (Back/Details Variant) -->
<header class="flex justify-between items-center px-container-padding py-md w-full sticky top-0 bg-background/90 backdrop-blur-md z-40">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface-variant hover:opacity-80 transition-opacity rounded-full focus:outline-none focus:bg-surface-container">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'wght' 400;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-on-background">Create Panelist</h1>
<div class="flex items-center gap-1 bg-surface-container px-3 py-1.5 rounded-full border border-surface-container-highest shadow-sm">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">generating_tokens</span>
<span class="font-label-md text-label-md text-on-surface font-semibold tracking-wide">120 Tokens</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-container-padding flex flex-col gap-md pb-[120px]">
<!-- Avatar Upload Section -->
<section class="flex flex-col items-center justify-center pt-sm pb-md">
<div class="relative w-28 h-28">
<div class="w-full h-full rounded-full bg-surface-container-high shadow-inner overflow-hidden border-4 border-surface-container-lowest">
<img class="w-full h-full object-cover opacity-60 mix-blend-multiply" data-alt="A clean, minimalist 3D rendered avatar placeholder featuring a soft clay-like material in neutral warm grey tones, set against a pristine white background. The lighting is studio-quality and soft, emphasizing a modern, professional light-mode aesthetic perfect for a high-end tech application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrxhSrI59djw-582G5FxyQAdGtq0CO5iE98tTaL94TA9kD39l9pkK-0KS49DLcshKlNx6w0C3ERn0zh5tDEW0-cGVnXL_3PY29Ih2uynsgqfAMFiJgcppYk1iGvq4aGO32nS8vdtrqIPZx1T8v7yOvltF8rntsOJFW9XNocMYx7QvNmMmeFN7q63B0v-w5fIzZncaJE7dSVddWloY_gKP3KZ-c3r3HewEYnCVi1JuXA7M5LnLjReGd8F34IufhiKxKK1Np2yOXcw"/>
</div>
<button aria-label="Upload Photo" class="absolute bottom-0 right-0 w-9 h-9 bg-primary rounded-full flex items-center justify-center border-[3px] border-background shadow-[0_4px_12px_rgba(164,55,0,0.3)] hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-primary text-[20px]" style="font-variation-settings: 'wght' 600;">add</span>
</button>
</div>
<p class="mt-sm font-label-md text-on-surface-variant uppercase tracking-widest opacity-80">Profile Photo</p>
</section>
<!-- Identity Fields Card -->
<section class="bg-surface-container-lowest rounded-[28px] p-lg shadow-[0_8px_24px_-4px_rgba(26,26,26,0.04)] flex flex-col gap-md">
<div>
<label class="font-label-lg text-label-lg text-on-surface-variant block mb-xs" for="panelist-name">Panelist Name</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/30 focus:bg-surface-container-lowest transition-colors" id="panelist-name" placeholder="e.g. The Skeptical VC" type="text"/>
</div>
<div>
<label class="font-label-lg text-label-lg text-on-surface-variant block mb-xs" for="core-focus">Core Focus</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">target</span>
<input class="w-full bg-surface-container-low border-none rounded-xl pl-11 pr-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/30 focus:bg-surface-container-lowest transition-colors" id="core-focus" placeholder="e.g. Unit Economics" type="text"/>
</div>
</div>
</section>
<!-- Personality & Tone Card -->
<section class="bg-surface-container-lowest rounded-[28px] p-lg shadow-[0_8px_24px_-4px_rgba(26,26,26,0.04)] flex flex-col gap-lg">
<!-- Investment Stage -->
<div>
<label class="font-label-lg text-label-lg text-on-surface-variant block mb-xs">Investment Stage</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 font-body-md text-on-surface appearance-none focus:ring-2 focus:ring-primary/30 focus:bg-surface-container-lowest transition-colors">
<option disabled="" selected="" value="">Select Stage</option>
<option value="pre-seed">Pre-Seed</option>
<option value="seed">Seed</option>
<option value="series-a">Series A</option>
<option value="growth">Growth / Late Stage</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Aggression Level -->
<div>
<div class="flex justify-between items-center mb-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant block">Feedback Tone</label>
<span class="font-label-md text-primary bg-primary/10 px-2 py-0.5 rounded-full">Aggressive</span>
</div>
<!-- Segmented Control -->
<div class="flex bg-surface-container-low p-1 rounded-full relative">
<!-- Active Indicator Background (Mocked for visual) -->
<div class="absolute left-[66.66%] top-1 bottom-1 w-[33.33%] bg-surface-container-lowest shadow-sm rounded-full pointer-events-none transition-all"></div>
<button class="flex-1 py-2 text-center font-label-lg text-on-surface-variant z-10 hover:text-on-surface transition-colors">Supportive</button>
<button class="flex-1 py-2 text-center font-label-lg text-on-surface-variant z-10 hover:text-on-surface transition-colors">Neutral</button>
<button class="flex-1 py-2 text-center font-label-lg text-primary font-bold z-10 transition-colors">Hostile</button>
</div>
</div>
</section>
<!-- Persona Prompt Card -->
<section class="bg-surface-container-lowest rounded-[28px] p-lg shadow-[0_8px_24px_-4px_rgba(26,26,26,0.04)] flex flex-col">
<label class="font-label-lg text-label-lg text-on-surface-variant block mb-sm" for="persona-prompt">Detailed Persona Instructions</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/30 focus:bg-surface-container-lowest transition-colors min-h-[140px] resize-none" id="persona-prompt" placeholder="Describe the specific questions, biases, or historical examples this AI investor should lean on during the pitch review..."></textarea>
<div class="flex justify-between items-center mt-sm">
<p class="font-label-md text-on-surface-variant/60">Markdown supported</p>
<button class="text-primary font-label-lg hover:underline opacity-90">Use Template</button>
</div>
</section>
</main>
<!-- Bottom Fixed CTA -->
<div class="fixed bottom-0 left-0 w-full px-container-padding pb-[32px] pt-[24px] bg-gradient-to-t from-background via-background/95 to-transparent z-50">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm font-bold py-[18px] rounded-full shadow-[0_12px_32px_-8px_rgba(164,55,0,0.4)] hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 600;">check</span>
            Save &amp; Add to Panel
        </button>
</div>
