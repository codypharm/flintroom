openapi: 3.1.0
info:
  title: Flintroom API
  version: 0.1.0
paths:
  /v1/me:
    get:
      tags:
      - auth
      summary: Read Current Identity
      description: 'Answer whether the credential the app is holding is still good.


        The mobile client calls this on launch. A 200 means go straight in; a 401

        means sign in again.'
      operationId: auth_read_current_identity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
      security:
      - HTTPBearer: []
  /v1/auth/sessions:
    post:
      tags:
      - auth
      summary: Sign In
      description: 'Exchange a provider ID token for one of ours.


        A POST that creates a session rather than a user: whether an account is

        created is an implementation detail of who turns out to be signing in, and

        the client cannot know in advance. Repeating the call is safe and returns

        the same user, so a retry on a flaky connection costs nothing.'
      operationId: auth_sign_in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/sessions/refresh:
    post:
      tags:
      - auth
      summary: Refresh Session
      description: 'Trade a refresh token for a fresh pair.


        No bearer token required, and deliberately so: the whole point is to be

        reachable once the access token has expired.'
      operationId: auth_refresh_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/sessions/sign-out:
    post:
      tags:
      - auth
      summary: Sign Out
      description: 'End this session.


        Takes the refresh token rather than a bearer credential, because sign-out

        has to work once the access token has expired — which is the state a

        returning user is in before anything else happens.


        Always 204. Whether the token was real is not something this endpoint will

        tell an unauthenticated caller.'
      operationId: auth_sign_out
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions:
    post:
      tags:
      - sessions
      summary: Start Session
      description: 'Open a room for the caller, and hand them the key to its stream.


        The user is taken from the credential, never from the body: a client that

        could name the account would be able to spend somebody else''s minutes.


        Two service calls rather than one, and still no rules here — the sequence

        carries no branch and no condition, so nothing about *when* a room may open

        has leaked out of `SessionService`. If the mint ever grows a decision, it

        belongs behind a service of its own, as settlement did for the join between

        sessions and the ledger.


        A mint that failed after the start committed would leave the caller holding

        a room they cannot connect to and unable to open another until the reaper

        clears it, roughly a minute later. Both statements run on the same

        connection against the same database, so the case is nearly always "the

        database is gone", where the start would not have committed either.'
      operationId: sessions_start_session
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SessionStart'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStarted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Read Session
      description: One session, if it belongs to the caller.
      operationId: sessions_read_session
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/end:
    post:
      tags:
      - sessions
      summary: End Session
      description: 'The End button: an intent, honoured by the server.


        The end reason is not taken from the body. `user_ended` is the only ending

        a client is in a position to report, and every other reason in the enum

        decides whether minutes are refunded — a client that could name one would

        be choosing its own refund.'
      operationId: sessions_end_session
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/balance:
    get:
      tags:
      - billing
      summary: Read Balance
      description: 'How much interrogation time the caller has left.


        Through `ensure_current_period` rather than a plain read, because the

        monthly reset is lazy: a subscriber whose period rolled over overnight has

        not been granted the new month''s allowance until something asks. A plain

        read would show them zero minutes on a screen whose Start button works.'
      operationId: billing_read_balance
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceRead'
      security:
      - HTTPBearer: []
  /v1/materials/limits:
    get:
      tags:
      - materials
      summary: Read Limits
      description: 'What this caller may upload, and what the rung above would allow.


        Published so the app can refuse an oversized file locally, before it reads
        a

        byte. The refusal in `register_material` stays the real wall — this exists
        so

        the tier table has one home rather than a second copy shipped in an app

        release.'
      operationId: materials_read_limits
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialLimits'
      security:
      - HTTPBearer: []
  /v1/materials:
    post:
      tags:
      - materials
      summary: Register Material
      description: 'Claim somewhere to put a deck, and get the one URL that may fill
        it.


        The user is taken from the credential, never from the body: a client that

        could name the account would be able to upload into somebody else''s storage

        prefix and read it back.


        Refusals happen inside the service and before anything is signed, so an

        oversized or unreadable file costs no upload and leaves no row behind.'
      operationId: materials_register_material
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialDeclaration'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialUpload'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/materials/{material_id}/complete:
    post:
      tags:
      - materials
      summary: Complete Upload
      description: 'The client reports the bytes landed, and we check before believing
        it.


        This is the moment a material becomes extractable, which is the moment it

        starts costing money — so the state it moves into is the one the sweep

        claims, and a claim with no object behind it is refused here rather than

        discovered by a model call that fails.'
      operationId: materials_complete_upload
      security:
      - HTTPBearer: []
      parameters:
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/materials/{material_id}:
    get:
      tags:
      - materials
      summary: Read Material
      description: 'One material, if it belongs to the caller.


        No upload URL. Re-signing on every read would turn a lookup into a fresh

        write capability against a material that may already hold an extracted deck.

        A thumbnail URL is a different thing and is issued here: it reads one

        downscaled first page, which is the artefact deliberately kept when the

        source document is destroyed.'
      operationId: materials_read_material
      security:
      - HTTPBearer: []
      parameters:
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - materials
      summary: Delete Material
      description: 'Destroy a material and everything extracted from it.


        204 and no body: there is nothing left to describe. A second call is a 404,

        because a deleted material is not found from the moment of the request that

        deleted it — the row survives a few seconds longer for an extraction that
        may

        be mid-flight, which is bookkeeping rather than a window in which the user''s

        deck still exists.'
      operationId: materials_delete_material
      security:
      - HTTPBearer: []
      parameters:
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Material Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/archetypes:
    get:
      tags:
      - panels
      summary: Read Archetypes
      description: 'Who may be seated, and how many of them this caller''s plan allows.


        Authenticated even though the roster is the same for everybody, because the

        seat count is not: an unauthenticated version would have to answer with the

        free tier''s number and would be wrong for every paying caller. Splitting
        it

        into a public roster and a private cap would be two round trips for one

        screen.'
      operationId: panels_read_archetypes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchetypeCatalogue'
      security:
      - HTTPBearer: []
components:
  schemas:
    ArchetypeCatalogue:
      properties:
        archetypes:
          items:
            $ref: '#/components/schemas/ArchetypeRead'
          type: array
          title: Archetypes
        seats:
          type: integer
          title: Seats
        may_author:
          type: boolean
          title: May Author
          default: false
        upgrade_seats:
          anyOf:
          - type: integer
          - type: 'null'
          title: Upgrade Seats
      type: object
      required:
      - archetypes
      - seats
      title: ArchetypeCatalogue
      description: 'Everybody available, and how many of them this plan seats.


        The caps travel with the catalogue rather than sitting on a separate limits

        endpoint, because they are read at the same moment and by the same screen:
        a

        picker that knows the roster but not the seat count can only find out a

        fourth choice is refused by posting it.


        Same reasoning as `MaterialLimits` — the client refuses instantly with no

        round trip, and the server refusal stays the real wall.'
    ArchetypeRead:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        blurb:
          type: string
          title: Blurb
      type: object
      required:
      - name
      - title
      - blurb
      title: ArchetypeRead
      description: 'One panelist, as offered.


        Built from an `Archetype` by field name rather than by `model_validate`, so

        that adding a field to the library does not publish it. That is the whole

        safety property of this schema: the default has to be *withheld*, because
        the

        field most likely to be added next is another line of prompt text.'
    BalanceRead:
      properties:
        remaining_minutes:
          type: integer
          title: Remaining Minutes
        has_time_remaining:
          type: boolean
          title: Has Time Remaining
      type: object
      required:
      - remaining_minutes
      - has_time_remaining
      title: BalanceRead
      description: 'What a client is told about its own balance.


        Two fields, and the omissions are the point. No seconds: §4.6 forbids a

        depleting counter, and raw seconds on the wire is that counter with the

        rounding left to whoever wrote the client — one of them will round up and

        promise a minute that is not there.


        No per-bucket breakdown either. Which bucket a second comes from is spend

        ordering, an internal rule, and showing three numbers that deplete in turn

        is the credits display §4.6 exists to refuse.'
    EndReason:
      type: string
      enum:
      - user_ended
      - session_cap
      - grace_cap
      - idle_timeout
      - provider_failure
      - client_disconnect
      - provisioning_failed
      title: EndReason
      description: 'Why a session stopped.


        Recorded because these are not equivalent to the business: a session that

        ended because the user was finished is a success, and one that ended on a

        provider failure is a refund and an incident. Both look identical in the

        ledger without this.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Identity:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
      type: object
      required:
      - user_id
      title: Identity
      description: 'What the API will admit about the caller to the caller.


        Deliberately only the identifier. `CLAUDE.md` requires minimum necessary

        fields, and this endpoint''s job is answering "is this credential still

        good", not returning a profile.'
    MaterialDeclaration:
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
        content_type:
          type: string
          maxLength: 128
          minLength: 1
          title: Content Type
        byte_size:
          type: integer
          maximum: 1073741824.0
          exclusiveMinimum: 0.0
          title: Byte Size
      additionalProperties: false
      type: object
      required:
      - filename
      - content_type
      - byte_size
      title: MaterialDeclaration
      description: 'What the client says it is about to upload.


        Every field is a claim, and each is made binding by something other than

        trust: the size and the type are signed into the URL, so the store refuses
        a

        body that disagrees, and the filename is display-only and never reaches a

        path.


        `byte_size` is bounded on both ends here rather than only against the tier

        cap. The lower bound is what stops a negative length reaching the signer,

        where it becomes a vendor-specific error instead of a refusal; the upper is

        a sanity bound well above the largest tier, so an absurd number is a 422

        from the schema rather than arithmetic anybody has to reason about.'
    MaterialLimits:
      properties:
        tier:
          type: string
          title: Tier
        max_upload_bytes:
          type: integer
          title: Max Upload Bytes
        max_pages_per_material:
          type: integer
          title: Max Pages Per Material
        accepted_content_types:
          items:
            type: string
          type: array
          title: Accepted Content Types
        upgrade:
          anyOf:
          - $ref: '#/components/schemas/TierUpload'
          - type: 'null'
      type: object
      required:
      - tier
      - max_upload_bytes
      - max_pages_per_material
      - accepted_content_types
      title: MaterialLimits
      description: 'The caller''s own caps, and the rung above if there is one.


        Published so the app can refuse an oversized file locally — instantly, with

        no round trip and no partial upload — while the server refusal stays the

        real wall. The alternative was the client holding its own copy of the tier

        table, where a pricing change ships as an app release and the two can

        disagree without anyone noticing.'
    MaterialRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        state:
          $ref: '#/components/schemas/MaterialState'
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        byte_size:
          type: integer
          title: Byte Size
        created_at:
          type: string
          format: date-time
          title: Created At
        thumbnail_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
      type: object
      required:
      - id
      - state
      - filename
      - content_type
      - byte_size
      - created_at
      title: MaterialRead
      description: 'One material, as the client sees it.


        `storage_key` and `thumbnail_key` are deliberately absent. They are internal

        locators, and the only legitimate way to reach an object is a presigned URL

        this service issues after checking ownership — a key in a response is an

        invitation to build a client that constructs its own.'
    MaterialState:
      type: string
      enum:
      - awaiting_upload
      - pending
      - extracting
      - ready
      - failed
      title: MaterialState
      description: "The five states an attached material can be in.\n\n```\nawaiting_upload\
        \ ──► pending ──► extracting ──► ready\n       │                         \
        \        └──► failed\n       └──► (reaped — a presign nobody used)\n```\n\n\
        `awaiting_upload` exists because the row precedes the object: the presign\
        \ is\nsigned against a key, and ownership is checked on a row. Without it,\n\
        `pending` would mean both \"no bytes yet\" and \"bytes here, waiting its turn\"\
        ,\nand the extraction sweep claims `pending` — so it would pick up materials\n\
        nobody ever uploaded and pay a model to read nothing.\n\n`extracting` exists\
        \ for the same reason `finalizing` does on a session:\nwithout it nothing\
        \ separates \"still working\" from \"the process died\", and\nthe requeue\
        \ cannot be safe. Unlike settlement, a duplicate run here is not a\nrefused\
        \ write — it is a second invoice.\n\n`failed` is terminal and deliberately\
        \ not retried in place. A material that\ncould not be read is re-uploaded,\
        \ because the source document is deleted on\nsuccess and there is nothing\
        \ to reprocess from."
    MaterialUpload:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        state:
          $ref: '#/components/schemas/MaterialState'
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        byte_size:
          type: integer
          title: Byte Size
        created_at:
          type: string
          format: date-time
          title: Created At
        thumbnail_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
        upload_url:
          type: string
          title: Upload Url
      type: object
      required:
      - id
      - state
      - filename
      - content_type
      - byte_size
      - created_at
      - upload_url
      title: MaterialUpload
      description: 'A registered material, and the one URL that may receive its bytes.


        Returned only from the register call, never from a read. The URL is a bearer

        credential for a single object at a single size — short-lived by

        construction, and not the kind of thing to hand back on every GET.'
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          minLength: 1
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
      description: The stored credential, offered in exchange for a fresh pair.
    SessionRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        state:
          $ref: '#/components/schemas/SessionState'
        started_at:
          type: string
          format: date-time
          title: Started At
        end_reason:
          anyOf:
          - $ref: '#/components/schemas/EndReason'
          - type: 'null'
        settled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Settled At
        material_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Material Ids
        archetypes:
          items:
            type: string
          type: array
          title: Archetypes
      type: object
      required:
      - id
      - user_id
      - state
      - started_at
      title: SessionRead
      description: 'What a client is told about its own session.


        Deliberately narrower than the row. `last_progress_at`,

        `last_user_speech_at` and `grace_started_at` are metering machinery: the

        first two describe how the reaper decides a room is abandoned, and

        publishing them tells a client how to look alive without being there.


        `grace_started_at` is left out for a product reason rather than a security

        one — it is precisely "you have run out and are on borrowed time", which is

        the depleting counter Product.md §4.6 forbids showing. The room keeps

        running either way; the user has no decision to make from it.'
    SessionStart:
      properties:
        material_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 10
          title: Material Ids
        archetypes:
          items:
            type: string
          type: array
          maxItems: 25
          title: Archetypes
      additionalProperties: false
      type: object
      title: SessionStart
      description: 'What a room may be configured with: its grounding, and who is
        in it.


        Extra fields are refused rather than ignored. A client sending `materialIds`

        in camelCase should be told, not silently given an ungrounded room — which

        is the failure that looks exactly like the panel being bad at its job.'
    SessionStarted:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        state:
          $ref: '#/components/schemas/SessionState'
        started_at:
          type: string
          format: date-time
          title: Started At
        end_reason:
          anyOf:
          - $ref: '#/components/schemas/EndReason'
          - type: 'null'
        settled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Settled At
        material_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Material Ids
        archetypes:
          items:
            type: string
          type: array
          title: Archetypes
        stream_ticket:
          type: string
          title: Stream Ticket
      type: object
      required:
      - id
      - user_id
      - state
      - started_at
      - stream_ticket
      title: SessionStarted
      description: 'The only response that carries a stream ticket.


        Separate from `SessionRead` rather than a nullable field on it, because the

        two are answers to different questions. Reading a session or ending one

        must not mint a credential, and a shared schema is how that eventually

        happens by accident — a handler returns the wider type, and a ticket

        appears on a response nobody meant to put one on.'
    SessionState:
      type: string
      enum:
      - provisioning
      - active
      - finalizing
      - settled
      - failed
      title: SessionState
      description: "The five states a session can be in.\n\n```\nprovisioning ──►\
        \ active ──► finalizing ──► settled\n     │\n     └──► failed\n```\n\n`provisioning`\
        \ and `failed` exist because ElevenLabs agent spin-up takes\nreal time and\
        \ can fail before any audio exists. Without them a spin-up\nfailure is indistinguishable\
        \ from a real session in every query and every\ncost report.\n\n`finalizing`\
        \ exists because settlement must be crash-safe: without it,\nnothing separates\
        \ \"finished settling\" from \"died halfway,\" and the reaper\ncannot safely\
        \ retry."
    SignInRequest:
      properties:
        provider:
          type: string
          maxLength: 32
          minLength: 1
          title: Provider
        id_token:
          type: string
          maxLength: 8192
          minLength: 1
          title: Id Token
      type: object
      required:
      - provider
      - id_token
      title: SignInRequest
      description: 'What the app sends after a native Sign in with Apple or Google.


        `provider` is a plain string rather than an enum on purpose. A closed set

        would answer an unrecognised value with a 422 listing the ones we accept,

        which enumerates our configuration; an unknown provider is refused as an

        invalid sign-in instead.'
    SignedIn:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      title: SignedIn
      description: 'The credential pair the app stores.


        Both are returned by sign-in and by every refresh, because the refresh

        token rotates on use. A client that keeps the old one will be treated as a

        replay and lose the session, so "always store both" is the contract.'
    TierUpload:
      properties:
        tier:
          type: string
          title: Tier
        max_upload_bytes:
          type: integer
          title: Max Upload Bytes
        max_pages_per_material:
          type: integer
          title: Max Pages Per Material
      type: object
      required:
      - tier
      - max_upload_bytes
      - max_pages_per_material
      title: TierUpload
      description: What a tier accepts, for a client drawing an upgrade prompt.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
