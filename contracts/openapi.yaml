openapi: 3.1.0
info:
  title: Flintroom API
  version: 0.1.0
paths:
  /v1/me:
    get:
      tags:
      - auth
      summary: Read Current Identity
      description: 'Answer whether the credential the app is holding is still good.


        The mobile client calls this on launch. A 200 means go straight in; a 401

        means sign in again — and since 2026-08-20 that is not a description of an

        intention but of the app''s actual gate, which had none before #86.


        It also answers whether this account has ever described a room, because the

        same launch has to decide whether to ask. Two questions, one round trip, on

        the slowest screen in the product.'
      operationId: auth_read_current_identity
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - auth
      summary: Delete Current Account
      description: 'Ask for this account to be destroyed.


        Apple has required this since 2022 for any app supporting account creation,

        so it is a store blocker rather than a courtesy — and `docs/privacy-policy.md`

        cannot be published while it claims a control that does not exist.


        `DELETE /me` rather than a POST to a sub-resource, because the account is

        the thing being deleted and it is the resource this token already

        identifies. Nothing is read from the request: no body, no path parameter,

        nothing a caller could point at somebody else''s account.


        **202, not 204.** The window means nothing has been destroyed yet, and a

        204 would say otherwise on the one endpoint where overstating what happened

        is worst. The body carries the date so the app can say how long the user

        has to change their mind.


        Repeating it is not an error. A retry returns the same date rather than a

        409 — the app would otherwise have to render "already scheduled" as a

        failure, on the screen where a confusing answer costs the most trust.'
      operationId: auth_delete_current_account
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduled'
      security:
      - HTTPBearer: []
  /v1/onboarding:
    post:
      tags:
      - auth
      summary: Describe The Room
      description: 'Say what you are preparing for, after signing in rather than before.


        **This endpoint is a reversal, and it should be read as one.**

        `docs/onboarding.md` settled survey-first and had the answers ride on the

        sign-in request in a single call, because "a partially-created account with

        no configuration is a state worth not having". The architect reordered it
        on

        2026-08-20: a signed-out launch (#86) has no way in under survey-first, and
        a

        returning user is not the stranger that argument was about.


        So the refused state is now reachable on purpose, and this is what makes it

        survivable — an account can describe its room at any later moment, and

        `/v1/me` tells the client whether to ask.


        The user comes from the credential, never from the body. Both writes still

        happen in one transaction inside the service, because they are one answer.


        Rate-limited like every authenticated write. Nothing here is expensive, but

        it is the only endpoint that appends a row per call, and a client re-opened

        mid-survey will send it more than once.'
      operationId: auth_describe_the_room
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Answers'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/auth/sessions:
    post:
      tags:
      - auth
      summary: Sign In
      description: 'Exchange a provider ID token for one of ours.


        A POST that creates a session rather than a user: whether an account is

        created is an implementation detail of who turns out to be signing in, and

        the client cannot know in advance. Repeating the call is safe and returns

        the same user, so a retry on a flaky connection costs nothing.'
      operationId: auth_sign_in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/sessions/refresh:
    post:
      tags:
      - auth
      summary: Refresh Session
      description: 'Trade a refresh token for a fresh pair.


        No bearer token required, and deliberately so: the whole point is to be

        reachable once the access token has expired.'
      operationId: auth_refresh_session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/auth/sessions/sign-out:
    post:
      tags:
      - auth
      summary: Sign Out
      description: 'End this session.


        Takes the refresh token rather than a bearer credential, because sign-out

        has to work once the access token has expired — which is the state a

        returning user is in before anything else happens.


        Always 204. Whether the token was real is not something this endpoint will

        tell an unauthenticated caller.'
      operationId: auth_sign_out
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions:
    get:
      tags:
      - sessions
      summary: List Sessions
      description: 'This account''s rooms, newest first.


        Scoped by the caller''s own id, never by a query parameter. A list endpoint

        that took a user id would be an authorisation check waiting to be forgotten.


        Carries no transcript and no audio — `CLAUDE.md` keeps both out of list

        responses — only whether each room can still be heard, and until when.'
      operationId: sessions_list_sessions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionRead'
                type: array
                title: Response Sessions List Sessions
      security:
      - HTTPBearer: []
    post:
      tags:
      - sessions
      summary: Start Session
      description: 'Open a room for the caller, and hand them the key to its stream.


        The user is taken from the credential, never from the body: a client that

        could name the account would be able to spend somebody else''s minutes.


        Two service calls rather than one, and still no rules here — the sequence

        carries no branch and no condition, so nothing about *when* a room may open

        has leaked out of `SessionService`. If the mint ever grows a decision, it

        belongs behind a service of its own, as settlement did for the join between

        sessions and the ledger.


        A mint that failed after the start committed would leave the caller holding

        a room they cannot connect to and unable to open another until the reaper

        clears it, roughly a minute later. Both statements run on the same

        connection against the same database, so the case is nearly always "the

        database is gone", where the start would not have committed either.'
      operationId: sessions_start_session
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SessionStart'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStarted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Read Session
      description: One session, if it belongs to the caller.
      operationId: sessions_read_session
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/preferences/recording:
    get:
      tags:
      - sessions
      summary: Read Recording Preference
      description: Whether rooms are being saved for this account.
      operationId: sessions_read_recording_preference
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPreference'
      security:
      - HTTPBearer: []
    put:
      tags:
      - sessions
      summary: Set Recording Preference
      description: 'Turn saving on or off for future rooms.


        `PUT` rather than `POST`, because this sets a value rather than appending

        one — the second identical request is the same state, which is exactly what

        a toggle tapped twice on a slow connection produces.


        Affects rooms started after this. Existing recordings are deliberately left

        alone: they were made under a disclosure the user accepted, and destroying

        them as a side effect of a switch would be a surprise in the one direction

        that cannot be undone. Deleting a room is its own explicit action, below.'
      operationId: sessions_set_recording_preference
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingPreferenceUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPreference'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/sessions/{session_id}/recording:
    delete:
      tags:
      - sessions
      summary: Delete Recording
      description: 'Destroy one room''s audio, because the user asked.


        204 whether or not there was anything there. `CLAUDE.md` lists duplicate

        actions as a case to handle rather than a 500, and a second tap is asking

        for something already true — answering 404 would tell somebody their

        deletion failed at the moment it had in fact succeeded.


        The transcript survives. The two artefacts have separate lifetimes by

        design, and this must not quietly take the debrief''s grounding with it.'
      operationId: sessions_delete_recording
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - sessions
      summary: Play Recording
      description: 'A link to hear one room again.


        Plays the stored object. ElevenLabs is never called and no credits are

        consumed — re-synthesising a room costs about a hundred times what storing

        it does, and could not reproduce the user''s own voice at any price.


        Ownership is settled by `OwnedSession` before this body runs, and the

        recording''s state is checked before a URL is asked for. `core/storage.py`

        says why that order matters: signing is not a permission check, and that

        layer signs whatever it is told to sign.


        Refuses rather than signing a key that is not there. A URL to an absent

        object is a link that reaches the store, fails there, and leaves the client

        reading somebody else''s error page — and the state is already published on

        the session, so a well-behaved client never arrives here at all.'
      operationId: sessions_play_recording
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPlayback'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/end:
    post:
      tags:
      - sessions
      summary: End Session
      description: 'The End button: an intent, honoured by the server.


        The end reason is not taken from the body. `user_ended` is the only ending

        a client is in a position to report, and every other reason in the enum

        decides whether minutes are refunded — a client that could name one would

        be choosing its own refund.'
      operationId: sessions_end_session
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/progress:
    get:
      tags:
      - sessions
      summary: Read Progress
      description: 'Whether this account is getting better.


        Scoped by the credential, never by a parameter — the same rule the session

        list follows, and for the same reason: an id in the query is an

        authorisation check waiting to be forgotten.


        **Arithmetic over what the debrief already stored.** No model call and no

        second judgement: #57''s reading of a room is the one judgement in this

        pipeline, and an opinion layered on top would be a second thing to be wrong

        about the same session.


        Carries no transcript and no findings text — only counts, and the rung each

        count was earned at.'
      operationId: sessions_read_progress
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressRead'
      security:
      - HTTPBearer: []
  /v1/sessions/{session_id}/transcript:
    get:
      tags:
      - sessions
      summary: Read Transcript
      description: 'Every line of one room, in the order it happened.


        The Library''s other half. A transcript has been kept for the life of the

        account since it was first persisted — `docs/session-retention.md` gives it

        a longer window than the audio because text is tens of kilobytes and does

        not compound — and nothing has ever served it to whoever said it.


        **`OwnedSession` before the body runs, and here that is the whole design.**

        A transcript is the most private thing this product holds. `CLAUDE.md` keeps

        one out of *list* responses, which is exactly the carve-out this fits: a

        single room, named in the path, read by its owner. Nothing here widens what

        is kept, how long it is kept, or who may read it.


        Unbounded and unpaginated on purpose. `SESSION_LIMIT` caps a room at twelve

        minutes, so a transcript is bounded by the product rather than by hope — a

        page parameter would be machinery for a case the meter already prevents.


        Empty is a real answer, not a refusal. A room can end before the panel gets

        a question out, and 404 there would say the room does not exist.'
      operationId: sessions_read_transcript
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/debrief:
    get:
      tags:
      - sessions
      summary: Read Debrief
      description: 'What went badly in this room, worst first.


        The first open reads the room with a reasoning model and stores the result;

        every open after hands back what was stored. That matters on a phone, where

        backgrounding and resuming re-fetches: a recomputed list would cost a second

        model call *and* reshuffle, because the ranking moves between runs on the

        same transcript.


        `OwnedSession` settles who is asking before this body runs, which is more

        than routine here — a transcript is the most private thing the product

        holds, kept for the life of the account precisely so the debrief can read

        it. A 403 returned after the model had read the room would still have read

        the room.


        Three rooms are refused rather than debriefed, each as a typed error a

        client can act on: one still running, one where the panel never asked

        anything, and one the provider broke — which offers a fresh room, because

        the minutes are already back.'
      operationId: sessions_read_debrief
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebriefRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/debrief/opening/speech:
    post:
      tags:
      - sessions
      summary: Say The Opening Again
      description: 'Hear the greeting again.


        The opening speaks itself on arrival and comes back silent on every read

        after, because `docs/voice-cost.md` puts the expressive speaker at about

        $0.0002 a character — a spoken greeting costs roughly a minute of live

        interrogation, and the debrief read is what a backgrounded phone repeats.

        This is where that cost is paid instead: once, when somebody asks.


        `POST` rather than `GET`, and not for style. It is not safe and it is not

        cacheable: every call pays a synthesis vendor, and a proxy or a client

        library that retried a `GET` for free would be spending money it thought was

        idempotent.


        Rate-limited for the same reason. This is the only endpoint in the product

        where one authenticated user can spend a vendor at will, and no honest

        client presses replay in a loop.


        Unmetered, like every coaching turn — there is no path from here to a

        balance.'
      operationId: sessions_say_the_opening_again
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachTurnRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/debrief/turns:
    post:
      tags:
      - sessions
      summary: Speak To Coach
      description: 'Say one thing to the coach, and hear one thing back.


        One turn per request rather than a socket. `docs/debrief-and-sparring.md`

        decision 5: hands-free is a property of the *interrogation*, so the debrief

        has no barge-in to support and nothing to overlap, and a held socket would

        bill for silence on an unmetered phase — the failure `IDLE_LIMIT` exists to

        catch in the room.


        Not "push-to-talk", which that decision said and its 2026-08-18 amendment

        withdrew. The argument was always about transport; how the client starts and

        stops recording is a separate choice, and the shipped one is tap-to-start,

        tap-to-stop.


        Unmetered, and no ticket. Nothing about this call touches the ledger, which

        is the metering boundary being structural rather than remembered: there is

        no code path from here to a balance.


        The reply carries text as well as audio. That is the accessibility floor

        `CLAUDE.md` sets — WCAG 2.2 AA plus live captions, as a v1 requirement — and

        a client cannot caption bytes it was handed.'
      operationId: sessions_speak_to_coach
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachTurnRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
  /v1/sessions/{session_id}/debrief/weak-answers/{rank}/attempts:
    post:
      tags:
      - sessions
      summary: Spar
      description: 'Answer one of the room''s questions again, and hear what changed.


        §3.5''s re-try loop: *"the coach replays a question the user fumbled and has

        them re-answer on the spot, repeatedly, until the response holds. Teaching,

        not just scoring."*


        **The question is in the path, not in the body.** That is

        `docs/debrief-and-sparring.md` decision 4''s anchor, and it is required

        rather than conventional: a re-answer is fresh speech about the session,

        which is precisely the shape *"spar me on this instead"* would use to

        smuggle in a new pitch. Addressing a stored rank means there is no argument

        in which a different subject could be named.


        Nothing here announces a verdict. The coach says what changed between this

        attempt and the last; the user decides when to stop. Telling somebody a thin

        answer landed sends them into the real room believing it, which is the one

        outcome this loop exists to prevent.


        Unmetered, like every coaching turn, and with no path from here to a

        balance.'
      operationId: sessions_spar
      security:
      - HTTPBearer: []
      parameters:
      - name: rank
        in: path
        required: true
        schema:
          type: integer
          title: Rank
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachTurnRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
  /v1/balance:
    get:
      tags:
      - billing
      summary: Read Balance
      description: 'How much interrogation time the caller has left.


        Through `ensure_current_period` rather than a plain read, because the

        monthly reset is lazy: a subscriber whose period rolled over overnight has

        not been granted the new month''s allowance until something asks. A plain

        read would show them zero minutes on a screen whose Start button works.'
      operationId: billing_read_balance
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceRead'
      security:
      - HTTPBearer: []
  /v1/plans:
    get:
      tags:
      - billing
      summary: Read Plans
      description: 'What each rung gets you, and which one you are on.


        Published so the buy screen can describe a plan before any store exists —

        #95. Prices are not here and never will be: they belong to the store, in the

        buyer''s currency, and a screen carrying its own would state one number and

        charge another.'
      operationId: billing_read_plans
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlanRead'
                type: array
                title: Response Billing Read Plans
      security:
      - HTTPBearer: []
  /v1/purchase-options:
    get:
      tags:
      - billing
      summary: Read Purchase Options
      description: 'Which control the buy screen leads with, per §4.5.


        Separate from `/balance` rather than a field on it, and on purpose. Balance

        is polled from the top bar of every screen; this is read once, by a screen

        somebody deliberately opened, and it costs a count over `ledger_entries`.

        Folding it in would put that query on the hottest path in the API to answer

        a question nobody on those screens is asking.'
      operationId: billing_read_purchase_options
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOptions'
      security:
      - HTTPBearer: []
  /v1/materials/limits:
    get:
      tags:
      - materials
      summary: Read Limits
      description: 'What this caller may upload, and what the rung above would allow.


        Published so the app can refuse an oversized file locally, before it reads
        a

        byte. The refusal in `register_material` stays the real wall — this exists
        so

        the tier table has one home rather than a second copy shipped in an app

        release.'
      operationId: materials_read_limits
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialLimits'
      security:
      - HTTPBearer: []
  /v1/materials:
    get:
      tags:
      - materials
      summary: List Materials
      description: 'Everything this account still has attached, newest first.


        The gap this closes is smaller than it sounds and worse than it sounds: the

        module could return one material by id and destroy one by id, and offered
        no

        way to *learn* an id. So the delete control was reachable only by a caller

        still holding the registration response, and a screen could not answer "what

        do you hold" without guessing.


        Carries a signed thumbnail per row, like the single read — signing is an

        HMAC and touches no network, so a list of ten costs one query.'
      operationId: materials_list_materials
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MaterialRead'
                type: array
                title: Response Materials List Materials
      security:
      - HTTPBearer: []
    post:
      tags:
      - materials
      summary: Register Material
      description: 'Claim somewhere to put a deck, and get the one URL that may fill
        it.


        The user is taken from the credential, never from the body: a client that

        could name the account would be able to upload into somebody else''s storage

        prefix and read it back.


        Refusals happen inside the service and before anything is signed, so an

        oversized or unreadable file costs no upload and leaves no row behind.'
      operationId: materials_register_material
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialDeclaration'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialUpload'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/materials/{material_id}/complete:
    post:
      tags:
      - materials
      summary: Complete Upload
      description: 'The client reports the bytes landed, and we check before believing
        it.


        This is the moment a material becomes extractable, which is the moment it

        starts costing money — so the state it moves into is the one the sweep

        claims, and a claim with no object behind it is refused here rather than

        discovered by a model call that fails.'
      operationId: materials_complete_upload
      security:
      - HTTPBearer: []
      parameters:
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/materials/{material_id}:
    get:
      tags:
      - materials
      summary: Read Material
      description: 'One material, if it belongs to the caller.


        No upload URL. Re-signing on every read would turn a lookup into a fresh

        write capability against a material that may already hold an extracted deck.

        A thumbnail URL is a different thing and is issued here: it reads one

        downscaled first page, which is the artefact deliberately kept when the

        source document is destroyed.'
      operationId: materials_read_material
      security:
      - HTTPBearer: []
      parameters:
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - materials
      summary: Delete Material
      description: 'Destroy a material and everything extracted from it.


        204 and no body: there is nothing left to describe. A second call is a 404,

        because a deleted material is not found from the moment of the request that

        deleted it — the row survives a few seconds longer for an extraction that
        may

        be mid-flight, which is bookkeeping rather than a window in which the user''s

        deck still exists.'
      operationId: materials_delete_material
      security:
      - HTTPBearer: []
      parameters:
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Material Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/archetypes:
    get:
      tags:
      - panels
      summary: Read Archetypes
      description: 'Who may be seated, and how many of them this caller''s plan allows.


        Authenticated even though the roster is the same for everybody, because the

        seat count is not: an unauthenticated version would have to answer with the

        free tier''s number and would be wrong for every paying caller. Splitting
        it

        into a public roster and a private cap would be two round trips for one

        screen.'
      operationId: panels_read_archetypes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchetypeCatalogue'
      security:
      - HTTPBearer: []
  /v1/me/difficulty:
    put:
      tags:
      - panels
      summary: Choose Difficulty
      description: 'Set how hard the room will push.


        On `/me` rather than under the catalogue, because the rung is a fact about

        the account and not about the roster — the read rides the catalogue only

        because that is the request the setup screen already makes, and a write has

        no such screen to share.


        Returns what was stored rather than 204. The client has just moved a

        control and needs to render its new position from the server''s answer,

        which is also how it learns that a rung it asked for was not the rung it

        got — though today it always is, because an invalid one is refused rather

        than clamped.


        May go down as well as up (`docs/difficulty-calibration.md` decision 5).

        That is safe because level 1 still presses an unanswered question, so this

        control cannot turn the wedge off, and because calibration carries on from

        wherever it is left — it is a starting point, never a floor.'
      operationId: panels_choose_difficulty
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DifficultyChoice'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DifficultyChoice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/archetypes/mine:
    get:
      tags:
      - panels
      summary: Read My Archetypes
      description: 'The panelists this account wrote, live ones only.


        Empty rather than 404 for an account that has written none: nothing is

        missing, they simply have no panel yet, and a client that had to branch on

        404 to render an empty list would treat "no panelists" as an error state.


        Their own `persona` comes back, unlike a shipped archetype''s, whose prompt

        text never leaves the server. There is nothing to protect — they wrote it,

        and the form has to be able to reopen it. What stays ours is the attack

        strategy composed around it, which is absent from the schema entirely.


        Not rate-limited. It is a read, and the setup screen makes it on open.'
      operationId: panels_read_my_archetypes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AuthoredArchetypeRead'
                type: array
                title: Response Panels Read My Archetypes
      security:
      - HTTPBearer: []
    post:
      tags:
      - panels
      summary: Write Archetype
      description: 'Write a panelist.


        201 with the row, because the client needs the minted name: it is what

        `SessionStart.archetypes` takes, and without it the form would have to

        re-read the roster to find what it just created.'
      operationId: panels_write_archetype
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchetypeDraft'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoredArchetypeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/archetypes/mine/{name}:
    put:
      tags:
      - panels
      summary: Revise Archetype
      description: 'Edit a panelist, whole.


        PUT rather than PATCH: the form holds every field and sends every field, so

        a partial update would be a shape the client never produces and a second

        merge rule to get wrong.


        **The returned `name` may not be the one in the path.** A panelist that has

        been seated is replaced rather than mutated, so old rooms keep pointing at

        the text that was actually in them (`docs/custom-archetypes.md` §4) — which

        is exactly why the row comes back rather than a 204. A client that assumed

        the name survived would hold a stale one.'
      operationId: panels_revise_archetype
      security:
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchetypeDraft'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoredArchetypeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - panels
      summary: Retire Archetype
      description: 'Take a panelist out of the panel.


        **DELETE, and it archives.** The verb is the client''s, the behaviour is

        ours: the row stays so every past room can still say who was in it, and

        §4 requires the *control* to read "remove from your panel" rather than

        "delete" for the same reason. `docs/privacy-policy.md` has to say what

        actually happens — account deletion is the real delete.


        Idempotent, so a retried request whose response was lost still answers 204

        rather than telling somebody their panelist has vanished.'
      operationId: panels_retire_archetype
      security:
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Answers:
      properties:
        situation:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Situation
        happens_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Happens On
        role:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Role
        audience:
          items:
            type: string
          type: array
          maxItems: 8
          title: Audience
      additionalProperties: false
      type: object
      title: Answers
      description: 'The five questions, as answered.


        Every field is optional, and that is deliberate rather than lax. The survey

        can be abandoned at any point and still produce an account — the room simply

        falls back further down `composition.compose`''s chain. A required field here

        would turn "I skipped a question" into "sign-in failed", at the exact moment

        somebody has spent five screens and has nothing yet to show for it.'
    ArchetypeCatalogue:
      properties:
        archetypes:
          items:
            $ref: '#/components/schemas/ArchetypeRead'
          type: array
          title: Archetypes
        seats:
          type: integer
          title: Seats
        seated:
          items:
            type: string
          type: array
          title: Seated
        may_author:
          type: boolean
          title: May Author
          default: false
        upgrade_seats:
          anyOf:
          - type: integer
          - type: 'null'
          title: Upgrade Seats
        difficulty:
          type: integer
          title: Difficulty
          default: 1
        hardest:
          type: integer
          title: Hardest
          default: 3
        domains:
          items:
            $ref: '#/components/schemas/DomainRead'
          type: array
          title: Domains
        voices:
          items:
            $ref: '#/components/schemas/VoiceRead'
          type: array
          title: Voices
      type: object
      required:
      - archetypes
      - seats
      title: ArchetypeCatalogue
      description: 'Everybody available, and how many of them this plan seats.


        The caps travel with the catalogue rather than sitting on a separate limits

        endpoint, because they are read at the same moment and by the same screen:
        a

        picker that knows the roster but not the seat count can only find out a

        fourth choice is refused by posting it.


        Same reasoning as `MaterialLimits` — the client refuses instantly with no

        round trip, and the server refusal stays the real wall.'
    ArchetypeDraft:
      properties:
        title:
          type: string
          maxLength: 64
          minLength: 1
          title: Title
        persona:
          type: string
          maxLength: 400
          minLength: 1
          title: Persona
        domains:
          items:
            type: string
          type: array
          maxItems: 4
          minItems: 1
          title: Domains
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
      additionalProperties: false
      type: object
      required:
      - title
      - persona
      - domains
      title: ArchetypeDraft
      description: 'What somebody types to write a panelist.


        Four fields, and `docs/custom-archetypes.md` §0 says who supplies each.

        Everything absent from here is absent on purpose: `cadence`, `openers` and

        `nudges` are hand-written per archetype and a row carries none, the attack

        strategy is composed by us from `domains`, and the name is minted.'
    ArchetypeRead:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        blurb:
          type: string
          title: Blurb
      type: object
      required:
      - name
      - title
      - blurb
      title: ArchetypeRead
      description: 'One panelist, as offered.


        Built from an `Archetype` by field name rather than by `model_validate`, so

        that adding a field to the library does not publish it. That is the whole

        safety property of this schema: the default has to be *withheld*, because
        the

        field most likely to be added next is another line of prompt text.'
    AuthoredArchetypeRead:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        persona:
          type: string
          title: Persona
        domains:
          items:
            type: string
          type: array
          title: Domains
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
      type: object
      required:
      - name
      - title
      - persona
      - domains
      - voice
      title: AuthoredArchetypeRead
      description: 'One panelist somebody wrote, as their own device sees it.


        Their own words go back out, unlike a shipped archetype where `persona` is

        prompt text that never leaves the server. There is nothing to protect here:

        they wrote it, and the form has to be able to reopen it.'
    BalanceRead:
      properties:
        remaining_minutes:
          type: integer
          title: Remaining Minutes
        has_time_remaining:
          type: boolean
          title: Has Time Remaining
      type: object
      required:
      - remaining_minutes
      - has_time_remaining
      title: BalanceRead
      description: 'What a client is told about its own balance.


        Two fields, and the omissions are the point. No seconds: §4.6 forbids a

        depleting counter, and raw seconds on the wire is that counter with the

        rounding left to whoever wrote the client — one of them will round up and

        promise a minute that is not there.


        No per-bucket breakdown either. Which bucket a second comes from is spend

        ordering, an internal rule, and showing three numbers that deplete in turn

        is the credits display §4.6 exists to refuse.'
    CoachTurnRead:
      properties:
        text:
          type: string
          title: Text
        speech:
          type: string
          title: Speech
        heard:
          type: string
          title: Heard
      type: object
      required:
      - text
      - speech
      - heard
      title: CoachTurnRead
      description: 'What the coach said, in both channels at once.


        Text as well as audio, and the text is not a convenience. `CLAUDE.md` sets

        the accessibility floor at WCAG 2.2 AA **plus live captions**, as a v1

        requirement rather than a later addition — an audio-only reply is unusable

        for part of the audience, and a client cannot caption bytes.


        `speech` is base64 because this is JSON. The alternative was two round trips

        or a stored object, and a coaching turn is heard once and dropped:

        `docs/session-retention.md` gives the interrogation''s audio a per-tier

        window and says nothing about this, because nothing was going to keep it.'
    DebriefRead:
      properties:
        weak_answers:
          items:
            $ref: '#/components/schemas/WeakAnswerRead'
          type: array
          title: Weak Answers
        pressed:
          anyOf:
          - type: string
            enum:
            - harder
            - easier
          - type: 'null'
          title: Pressed
        opening:
          anyOf:
          - $ref: '#/components/schemas/CoachTurnRead'
          - type: 'null'
        thread:
          items:
            $ref: '#/components/schemas/CoachTurnRead'
          type: array
          title: Thread
        attempts:
          items:
            $ref: '#/components/schemas/SparringAttemptRead'
          type: array
          title: Attempts
      type: object
      required:
      - weak_answers
      title: DebriefRead
      description: 'What the coach and the prep sheet are both grounded in.


        An object rather than a bare list, because the debrief will carry more than

        this — a coaching thread, a soft-cap warning — and a client that unpacked
        a

        top-level array would have to change shape when it does.


        An empty list is a real answer: this room had nothing worth raising. It is

        not the same as the refusals, which arrive as typed errors precisely so a

        client can tell "you did well" from "there is nothing here".'
    DeletionScheduled:
      properties:
        purge_at:
          type: string
          format: date-time
          title: Purge At
      type: object
      required:
      - purge_at
      title: DeletionScheduled
      description: 'When an account that asked to be deleted actually goes.


        The date rather than a bare acknowledgement, because the window is

        recoverable and a user who is not told when it closes cannot use it. It is

        also what makes the repeat request legible: asking twice returns the same

        moment, which is the wire-level expression of a window that does not move.


        Nothing else is returned. `CLAUDE.md` wants minimum necessary fields, and

        the caller already knows whose account this is — they authenticated as

        them.'
    DifficultyChoice:
      properties:
        difficulty:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Difficulty
      type: object
      required:
      - difficulty
      title: DifficultyChoice
      description: 'The rung a user picked for themselves.


        Validated against the ladder rather than clamped. Clamping is right where
        a

        *stored* number is read back — `difficulty.pressure_at` does it, so a live

        room never ends over bookkeeping — and wrong here: this is a person

        choosing, and quietly handing them level 3 when they asked for 7 is a

        control that lies about what it did.'
    DomainRead:
      properties:
        name:
          type: string
          title: Name
        label:
          type: string
          title: Label
      type: object
      required:
      - name
      - label
      title: DomainRead
      description: One claim domain a panelist may own, and what it is called on a
        screen.
    EndReason:
      type: string
      enum:
      - user_ended
      - session_cap
      - grace_cap
      - idle_timeout
      - provider_failure
      - client_disconnect
      - provisioning_failed
      title: EndReason
      description: 'Why a session stopped.


        Recorded because these are not equivalent to the business: a session that

        ended because the user was finished is a success, and one that ended on a

        provider failure is a refund and an incident. Both look identical in the

        ledger without this.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Identity:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        onboarded:
          type: boolean
          title: Onboarded
          default: false
      type: object
      required:
      - user_id
      title: Identity
      description: 'What the API will admit about the caller to the caller.


        Still not a profile. `CLAUDE.md` requires minimum necessary fields, and this

        endpoint''s job is answering "is this credential still good" — plus, since

        2026-08-20, the one other thing the launch gate has to know before it can

        draw anything.'
    MaterialDeclaration:
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
        content_type:
          type: string
          maxLength: 128
          minLength: 1
          title: Content Type
        byte_size:
          type: integer
          maximum: 1073741824.0
          exclusiveMinimum: 0.0
          title: Byte Size
      additionalProperties: false
      type: object
      required:
      - filename
      - content_type
      - byte_size
      title: MaterialDeclaration
      description: 'What the client says it is about to upload.


        Every field is a claim, and each is made binding by something other than

        trust: the size and the type are signed into the URL, so the store refuses
        a

        body that disagrees, and the filename is display-only and never reaches a

        path.


        `byte_size` is bounded on both ends here rather than only against the tier

        cap. The lower bound is what stops a negative length reaching the signer,

        where it becomes a vendor-specific error instead of a refusal; the upper is

        a sanity bound well above the largest tier, so an absurd number is a 422

        from the schema rather than arithmetic anybody has to reason about.'
    MaterialLimits:
      properties:
        tier:
          type: string
          title: Tier
        max_upload_bytes:
          type: integer
          title: Max Upload Bytes
        max_pages_per_material:
          type: integer
          title: Max Pages Per Material
        accepted_content_types:
          items:
            type: string
          type: array
          title: Accepted Content Types
        upgrade:
          anyOf:
          - $ref: '#/components/schemas/TierUpload'
          - type: 'null'
      type: object
      required:
      - tier
      - max_upload_bytes
      - max_pages_per_material
      - accepted_content_types
      title: MaterialLimits
      description: 'The caller''s own caps, and the rung above if there is one.


        Published so the app can refuse an oversized file locally — instantly, with

        no round trip and no partial upload — while the server refusal stays the

        real wall. The alternative was the client holding its own copy of the tier

        table, where a pricing change ships as an app release and the two can

        disagree without anyone noticing.'
    MaterialRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        state:
          $ref: '#/components/schemas/MaterialState'
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        byte_size:
          type: integer
          title: Byte Size
        created_at:
          type: string
          format: date-time
          title: Created At
        thumbnail_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
      type: object
      required:
      - id
      - state
      - filename
      - content_type
      - byte_size
      - created_at
      title: MaterialRead
      description: 'One material, as the client sees it.


        `storage_key` and `thumbnail_key` are deliberately absent. They are internal

        locators, and the only legitimate way to reach an object is a presigned URL

        this service issues after checking ownership — a key in a response is an

        invitation to build a client that constructs its own.'
    MaterialState:
      type: string
      enum:
      - awaiting_upload
      - pending
      - extracting
      - ready
      - failed
      title: MaterialState
      description: "The five states an attached material can be in.\n\n```\nawaiting_upload\
        \ ──► pending ──► extracting ──► ready\n       │                         \
        \        └──► failed\n       └──► (reaped — a presign nobody used)\n```\n\n\
        `awaiting_upload` exists because the row precedes the object: the presign\
        \ is\nsigned against a key, and ownership is checked on a row. Without it,\n\
        `pending` would mean both \"no bytes yet\" and \"bytes here, waiting its turn\"\
        ,\nand the extraction sweep claims `pending` — so it would pick up materials\n\
        nobody ever uploaded and pay a model to read nothing.\n\n`extracting` exists\
        \ for the same reason `finalizing` does on a session:\nwithout it nothing\
        \ separates \"still working\" from \"the process died\", and\nthe requeue\
        \ cannot be safe. Unlike settlement, a duplicate run here is not a\nrefused\
        \ write — it is a second invoice.\n\n`failed` is terminal and deliberately\
        \ not retried in place. A material that\ncould not be read is re-uploaded,\
        \ because the source document is deleted on\nsuccess and there is nothing\
        \ to reprocess from."
    MaterialUpload:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        state:
          $ref: '#/components/schemas/MaterialState'
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        byte_size:
          type: integer
          title: Byte Size
        created_at:
          type: string
          format: date-time
          title: Created At
        thumbnail_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Url
        upload_url:
          type: string
          title: Upload Url
      type: object
      required:
      - id
      - state
      - filename
      - content_type
      - byte_size
      - created_at
      - upload_url
      title: MaterialUpload
      description: 'A registered material, and the one URL that may receive its bytes.


        Returned only from the register call, never from a read. The URL is a bearer

        credential for a single object at a single size — short-lived by

        construction, and not the kind of thing to hand back on every GET.'
    PlanRead:
      properties:
        name:
          type: string
          title: Name
        title:
          type: string
          title: Title
        minutes:
          type: integer
          title: Minutes
        renews:
          type: boolean
          title: Renews
        seats:
          type: integer
          title: Seats
        retention_days:
          type: integer
          title: Retention Days
        max_upload_mb:
          type: integer
          title: Max Upload Mb
        may_author:
          type: boolean
          title: May Author
        unmetered_coaching:
          type: boolean
          title: Unmetered Coaching
          default: true
        current:
          type: boolean
          title: Current
          default: false
      type: object
      required:
      - name
      - title
      - minutes
      - renews
      - seats
      - retention_days
      - max_upload_mb
      - may_author
      title: PlanRead
      description: 'One rung, described by what it gets you — never by what it costs.


        **The price is deliberately absent, and that is the whole seam.** What

        somebody is charged is the store''s: in their currency, after whatever

        regional adjustment applies, and changeable in a console without a release.

        What they *get* is ours, and every field here already existed in `tiers.py`

        before this schema did.


        Published rather than shipped in the app, on the argument

        `/v1/materials/limits` already made: *"this exists so the tier table has one

        home rather than a second copy shipped in an app release."* A client holding

        its own ladder can offer a plan we retired.'
    ProgressRead:
      properties:
        rooms:
          items:
            $ref: '#/components/schemas/RoomHeldRead'
          type: array
          title: Rooms
        habits:
          items:
            $ref: '#/components/schemas/TallyRead'
          type: array
          title: Habits
        askers:
          items:
            $ref: '#/components/schemas/TallyRead'
          type: array
          title: Askers
      type: object
      title: ProgressRead
      description: 'A history, with no total in it.


        No average, no lifetime figure, no streak. An average across rungs is

        arithmetic over incomparable rooms, and a single number is the shape that

        invites optimising the number instead of the argument.


        Every list empty is a real answer — a new account — rather than a refusal,

        so the screen can say "you have not run a room yet".'
    PurchaseOptions:
      properties:
        upgrade_first:
          type: boolean
          title: Upgrade First
        next_tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Tier
      type: object
      required:
      - upgrade_first
      title: PurchaseOptions
      description: 'Which control leads on the buy screen, and what there is to lead
        with.


        §4.5''s Credit-Toward-Upgrade Rule, answered on the server. The window and

        the threshold are business rules, and a client computing them from a raw

        count would be a second implementation free to drift from this one.


        **A decision, not a tally.** The count of top-ups is deliberately not on the

        wire. `BalanceRead` above refuses raw seconds for the same reason §4.6 gives

        — a number that only goes one way invites a display that makes people

        ration — and "you have topped up twice this month" is that display wearing
        a

        different hat. Somebody who bought two packs knows they bought two packs.'
    RecordingPlayback:
      properties:
        url:
          type: string
          title: Url
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
      type: object
      required:
      - url
      - expires_in_seconds
      title: RecordingPlayback
      description: 'A short-lived link to one room''s audio.


        Minted on demand rather than carried on the session, so every link that

        reaches a player is a live one. `expires_in_seconds` is published so a

        client can decide whether to reuse the link it holds or ask for another —

        without it the only way to find out is to play and fail.'
    RecordingPreference:
      properties:
        records_rooms:
          type: boolean
          title: Records Rooms
        retention_days:
          type: integer
          title: Retention Days
      type: object
      required:
      - records_rooms
      - retention_days
      title: RecordingPreference
      description: 'Whether this account''s rooms are recorded.


        One field, and it is the control the first-session disclosure points at.

        `docs/session-retention.md` chose on-by-default with a way out; this is the

        way out, and without it the disclosure would be describing something that

        does not exist.'
    RecordingPreferenceUpdate:
      properties:
        records_rooms:
          type: boolean
          title: Records Rooms
      type: object
      required:
      - records_rooms
      title: RecordingPreferenceUpdate
      description: Turning saving on or off. The only thing a client may set.
    RecordingRead:
      properties:
        state:
          $ref: '#/components/schemas/RecordingState'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - state
      title: RecordingRead
      description: 'What a client is told about a room''s audio, without minting anything.


        Carries no URL. A presigned link lives fifteen minutes and a session object

        can be cached, re-rendered or scrolled past for much longer, so embedding

        one here would hand out links that are dead by the time anybody presses

        play. The URL is minted by its own endpoint, at the moment it is wanted.'
    RecordingState:
      type: string
      enum:
      - available
      - expired
      - not_recorded
      title: RecordingState
      description: 'Whether a room can still be heard, and if not, why not.


        Three states rather than a nullable URL, because two of them are ordinary

        and mean different things to the person reading the screen. "No longer

        available" is a retention window arriving exactly on schedule; "not

        recorded" is saving having been off. Telling somebody the first when the

        second is true reads as data loss.'
    RefreshRequest:
      properties:
        refresh_token:
          type: string
          maxLength: 512
          minLength: 1
          title: Refresh Token
      type: object
      required:
      - refresh_token
      title: RefreshRequest
      description: The stored credential, offered in exchange for a fresh pair.
    RoomHeldRead:
      properties:
        session_id:
          type: string
          format: uuid
          title: Session Id
        rehearsal_id:
          type: string
          format: uuid
          title: Rehearsal Id
        rehearsal_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Rehearsal Name
        started_at:
          type: string
          format: date-time
          title: Started At
        challenged:
          type: integer
          title: Challenged
        held:
          type: integer
          title: Held
        level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Level
      type: object
      required:
      - session_id
      - rehearsal_id
      - started_at
      - challenged
      - held
      title: RoomHeldRead
      description: 'One assessed room: what it put to them, what held, and how hard
        it was.


        **All three on one object, never in three lists.** `held` and `challenged`

        mean nothing without `level`: difficulty escalates, so a room where more got

        past somebody may simply be a room that pressed harder. A client that could

        receive the figures separately from the rung could render them separately,

        and the first thing it would draw is a trend that tells an improving

        presenter they are getting worse.'
    SessionRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        rehearsal_id:
          type: string
          format: uuid
          title: Rehearsal Id
        rehearsal_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Rehearsal Name
        audience:
          anyOf:
          - type: string
          - type: 'null'
          title: Audience
        state:
          $ref: '#/components/schemas/SessionState'
        started_at:
          type: string
          format: date-time
          title: Started At
        end_reason:
          anyOf:
          - $ref: '#/components/schemas/EndReason'
          - type: 'null'
        settled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Settled At
        material_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Material Ids
        difficulty_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Difficulty Level
        recording:
          $ref: '#/components/schemas/RecordingRead'
        archetypes:
          items:
            type: string
          type: array
          title: Archetypes
      type: object
      required:
      - id
      - user_id
      - rehearsal_id
      - state
      - started_at
      title: SessionRead
      description: 'What a client is told about its own session.


        Deliberately narrower than the row. `last_progress_at`,

        `last_user_speech_at` and `grace_started_at` are metering machinery: the

        first two describe how the reaper decides a room is abandoned, and

        publishing them tells a client how to look alive without being there.


        `grace_started_at` is left out for a product reason rather than a security

        one — it is precisely "you have run out and are on borrowed time", which is

        the depleting counter Product.md §4.6 forbids showing. The room keeps

        running either way; the user has no decision to make from it.'
    SessionStart:
      properties:
        material_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 10
          title: Material Ids
        rehearsal_name:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Rehearsal Name
        audience:
          anyOf:
          - type: string
            maxLength: 400
          - type: 'null'
          title: Audience
        repeats:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Repeats
        archetypes:
          items:
            type: string
          type: array
          maxItems: 25
          title: Archetypes
      additionalProperties: false
      type: object
      title: SessionStart
      description: 'What a room may be configured with: its grounding, and who is
        in it.


        Extra fields are refused rather than ignored. A client sending `materialIds`

        in camelCase should be told, not silently given an ungrounded room — which

        is the failure that looks exactly like the panel being bad at its job.'
    SessionStarted:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        rehearsal_id:
          type: string
          format: uuid
          title: Rehearsal Id
        rehearsal_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Rehearsal Name
        audience:
          anyOf:
          - type: string
          - type: 'null'
          title: Audience
        state:
          $ref: '#/components/schemas/SessionState'
        started_at:
          type: string
          format: date-time
          title: Started At
        end_reason:
          anyOf:
          - $ref: '#/components/schemas/EndReason'
          - type: 'null'
        settled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Settled At
        material_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Material Ids
        difficulty_level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Difficulty Level
        recording:
          $ref: '#/components/schemas/RecordingRead'
        archetypes:
          items:
            type: string
          type: array
          title: Archetypes
        stream_ticket:
          type: string
          title: Stream Ticket
      type: object
      required:
      - id
      - user_id
      - rehearsal_id
      - state
      - started_at
      - stream_ticket
      title: SessionStarted
      description: 'The only response that carries a stream ticket.


        Separate from `SessionRead` rather than a nullable field on it, because the

        two are answers to different questions. Reading a session or ending one

        must not mint a credential, and a shared schema is how that eventually

        happens by accident — a handler returns the wider type, and a ticket

        appears on a response nobody meant to put one on.'
    SessionState:
      type: string
      enum:
      - provisioning
      - active
      - finalizing
      - settled
      - failed
      title: SessionState
      description: "The five states a session can be in.\n\n```\nprovisioning ──►\
        \ active ──► finalizing ──► settled\n     │\n     └──► failed\n```\n\n`provisioning`\
        \ and `failed` exist because ElevenLabs agent spin-up takes\nreal time and\
        \ can fail before any audio exists. Without them a spin-up\nfailure is indistinguishable\
        \ from a real session in every query and every\ncost report.\n\n`finalizing`\
        \ exists because settlement must be crash-safe: without it,\nnothing separates\
        \ \"finished settling\" from \"died halfway,\" and the reaper\ncannot safely\
        \ retry."
    SignInRequest:
      properties:
        provider:
          type: string
          maxLength: 32
          minLength: 1
          title: Provider
        id_token:
          type: string
          maxLength: 8192
          minLength: 1
          title: Id Token
        onboarding:
          anyOf:
          - $ref: '#/components/schemas/Answers'
          - type: 'null'
      type: object
      required:
      - provider
      - id_token
      title: SignInRequest
      description: 'What the app sends after a native Sign in with Apple or Google.


        `provider` is a plain string rather than an enum on purpose. A closed set

        would answer an unrecognised value with a 422 listing the ones we accept,

        which enumerates our configuration; an unknown provider is refused as an

        invalid sign-in instead.'
    SignedIn:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        deletion_cancelled:
          type: boolean
          title: Deletion Cancelled
          default: false
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in
      title: SignedIn
      description: 'The credential pair the app stores.


        Both are returned by sign-in and by every refresh, because the refresh

        token rotates on use. A client that keeps the old one will be treated as a

        replay and lose the session, so "always store both" is the contract.'
    SparringAttemptRead:
      properties:
        text:
          type: string
          title: Text
        speech:
          type: string
          title: Speech
        heard:
          type: string
          title: Heard
        weak_rank:
          type: integer
          title: Weak Rank
        attempt:
          type: integer
          title: Attempt
      type: object
      required:
      - text
      - speech
      - heard
      - weak_rank
      - attempt
      title: SparringAttemptRead
      description: 'One stored re-answer, and which question it answered again. #83.


        Extends `CoachTurnRead` rather than restating it, because that is exactly

        what a sparring turn is on the wire — `heard` is what the presenter said

        this time and `text` is what the coach said about the difference — and the

        live `spar` endpoint already returns that shape. Two schemas describing one

        thing is how a client comes to render a re-answer differently depending on

        whether it arrived live or on a resume.


        The two extra fields are the anchor. `weak_rank` is what the client keys

        attempts by (#59), and `attempt` is which go it was, which §3.5 treats as

        content: the second attempt at one question is a different fact from the

        first.


        `speech` is always empty here — see `DebriefRead.attempts`.'
    TallyRead:
      properties:
        name:
          type: string
          title: Name
        rooms:
          type: integer
          title: Rooms
      type: object
      required:
      - name
      - rooms
      title: TallyRead
      description: 'A thing, and how many *rooms* it happened in.


        Rooms rather than occurrences, because a habit is a thing that recurs. Two

        evasive answers in one bad afternoon is one room where it happened, and

        counting occurrences would let a single disastrous session read as a

        pattern — the opposite of what somebody should take from it.'
    TierUpload:
      properties:
        tier:
          type: string
          title: Tier
        max_upload_bytes:
          type: integer
          title: Max Upload Bytes
        max_pages_per_material:
          type: integer
          title: Max Pages Per Material
      type: object
      required:
      - tier
      - max_upload_bytes
      - max_pages_per_material
      title: TierUpload
      description: What a tier accepts, for a client drawing an upgrade prompt.
    TranscriptLineRead:
      properties:
        ordinal:
          type: integer
          title: Ordinal
        speaker:
          type: string
          title: Speaker
        text:
          type: string
          title: Text
        said_at:
          type: string
          format: date-time
          title: Said At
      type: object
      required:
      - ordinal
      - speaker
      - text
      - said_at
      title: TranscriptLineRead
      description: 'One line of one room, as it was said.


        `speaker` is `user` or an archetype''s `name` — the same identity used in

        logs, in routing and in the room''s own transcript. Never a rendered title:

        the client already resolves archetype names against the catalogue it reads

        to offer the picker, and a second spelling of "The CFO" on the wire is how

        two surfaces come to disagree about what somebody is called.'
    TranscriptRead:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/TranscriptLineRead'
          type: array
          title: Lines
      type: object
      required:
      - lines
      title: TranscriptRead
      description: 'A room, read back.


        An object around the list rather than a bare array, for the reason

        `DebriefRead` gives: a transcript will grow a companion — time offsets when

        #69 lands, a recording''s state — and a client that unpacked a top-level

        array would have to change shape when it does.


        An empty list is a real answer rather than a refusal. A room can end before

        the panel gets a question out, and a 404 there would say the room does not

        exist, which is a different and wrong statement.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VoiceRead:
      properties:
        name:
          type: string
          title: Name
        label:
          type: string
          title: Label
        sounds:
          type: string
          title: Sounds
      type: object
      required:
      - name
      - label
      - sounds
      title: VoiceRead
      description: One voice a panelist may be cast in, and what it sounds like.
    WeakAnswerRead:
      properties:
        ordinal:
          type: integer
          title: Ordinal
        question:
          type: string
          title: Question
        asked_by:
          type: string
          title: Asked By
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
        weakness:
          type: string
          title: Weakness
        why:
          type: string
          title: Why
        next_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Time
      type: object
      required:
      - ordinal
      - question
      - asked_by
      - answer
      - weakness
      - why
      title: WeakAnswerRead
      description: 'One question the room did not get a good enough answer to.


        Carries the presenter''s own words back, not only a verdict. §3.5''s artefact

        is *"the 6 questions you will get, and where your answers are thin"*, and
        a

        response of categories alone would be a scorecard — the delivery-metrics

        product this one exists to refuse.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
